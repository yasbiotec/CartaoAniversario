<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversário, Junli! 🌊🎂</title>

  <!-- Importação de Fontes: Quicksand (Delicada/Fofa) e Silkscreen (Pixel Gamer) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIÁVEIS E CONFIGURAÇÕES GERAIS
       ========================================================================== */
    :root {
      --ocean-deep: #006064;
      --font-cute: 'Quicksand', sans-serif;
      --font-gamer: 'Silkscreen', cursive, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 15%, #b2ebf2 0%, #26c6da 45%, #00838f 85%, #004d40 100%) no-repeat fixed center / cover;
      font-family: var(--font-cute);
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    /* ==========================================================================
       2. AMBIENTE DO OCEANO (LUZES E BOLHAS)
       ========================================================================== */
    .sunbeams {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.12) 0px,
        rgba(255, 255, 255, 0.02) 60px,
        transparent 120px,
        transparent 220px
      );
      pointer-events: none;
      z-index: 0;
      animation: swayLight 10s ease-in-out infinite alternate;
    }

    @keyframes swayLight {
      0% { transform: scale(1.05) rotate(-1deg); opacity: 0.7; }
      100% { transform: scale(1.15) rotate(2deg); opacity: 1; }
    }

    .bubble {
      position: absolute;
      bottom: -60px;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.15) 60%, rgba(178, 235, 242, 0.4) 100%);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.5), 0 0 10px rgba(255, 255, 255, 0.2);
      animation: rise infinite ease-in;
      pointer-events: none;
      z-index: 1;
      will-change: transform, bottom;
    }

    @keyframes rise {
      0%   { bottom: -60px; transform: translateX(0) scale(0.8); opacity: 0; }
      15%  { opacity: 0.85; }
      50%  { transform: translateX(25px) scale(1); }
      85%  { opacity: 0.85; }
      100% { bottom: 105vh; transform: translateX(-25px) scale(1.15); opacity: 0; }
    }

    /* ==========================================================================
       3. CENA 3D E ESTRUTURA DO CARTÃO
       ========================================================================== */
    .scene-container {
      perspective: 1400px;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      z-index: 10;
    }

    .scene-container:active {
      cursor: grabbing;
    }

    .scene {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.12s ease-out;
      will-change: transform;
    }

    .card {
      width: 320px;
      height: 450px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 1.2s ease;
      box-shadow: 
        0 20px 45px rgba(0, 43, 54, 0.45),
        0 0 25px rgba(0, 225, 255, 0.35);
      cursor: pointer;
      border-radius: 10px;
    }

    .card.open {
      transform: translateX(160px);
      box-shadow: 
        15px 25px 50px rgba(0, 43, 54, 0.5),
        0 0 35px rgba(178, 235, 242, 0.5);
    }

    .flap {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 2;
      will-change: transform;
    }

    .card.open .flap {
      transform: rotateY(-180deg);
    }

    .face, .inside-right, .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-size: 200% 100%;
      background-repeat: no-repeat;
      border-radius: 10px;
      overflow: hidden;
    }

    .front {
      background-image: url('1.png');
      background-position: right top;
      background-color: #d1fbfd;
    }

    .front::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 55%);
      pointer-events: none;
      border-radius: 10px;
    }

    .inside-left {
      background-image: url('2.png');
      background-position: left top;
      background-color: #d1fbfd;
      transform: rotateY(180deg);
      box-shadow: inset -12px 0 20px -10px rgba(0, 77, 64, 0.25);
    }

    .inside-right {
      background-image: url('2.png');
      background-position: right top;
      background-color: #e0f7fa;
      z-index: 1;
      transform-origin: center center;
      box-shadow: inset 12px 0 20px -10px rgba(0, 77, 64, 0.25);
    }

    .back {
      background-image: url('1.png');
      background-position: left top;
      background-color: #80deea;
      transform: rotateY(180deg);
      z-index: 0;
    }

    /* ==========================================================================
       4. RASPADINHA DIGITAL (GLASSMORPHISM & QUEST REWARD)
       ========================================================================== */
    .scratch-container {
      position: absolute;
      top: 33%;
      left: 12%;
      width: 76%;
      height: 42%;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-top-color: rgba(255, 255, 255, 0.8);
      border-left-color: rgba(255, 255, 255, 0.8);
      box-shadow: 
        0 15px 35px rgba(0, 77, 64, 0.1),
        inset 0 0 25px rgba(255, 255, 255, 0.7);
      overflow: hidden;
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 16px;
      animation: floatCinematic 6s ease-in-out infinite;
    }

    @keyframes floatCinematic {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .quest-tag {
      font-family: var(--font-gamer);
      font-size: 10px;
      color: #ffffff;
      background: linear-gradient(90deg, #26c6da, #00acc1);
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(0, 172, 193, 0.3);
      pointer-events: none;
    }

  .scratch-secret {
    font-family: var(--font-cute);
    color: #1B365D;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
    pointer-events: none;
  }

  .scratch-secret .coupon-highlight {
    display: inline-block;
    color: #1B365D; /* Mantido o azul marinho elegante */
    font-size: 20px;
    margin: 4px 0;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
  }

    .scratch-secret .coupon-sub {
      display: block;
      font-size: 13px;
      color: #4a6b8c; /* Azul acinzentado suave para leitura leve */
      font-weight: 500;
      margin-top: 6px;
      background: rgba(240, 248, 255, 0.85);
      border: 1px solid rgba(182, 216, 242, 0.5);
      padding: 4px 12px;
      border-radius: 10px;
    }

    .scratch-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      transition: opacity 0.6s ease;
      border-radius: 19px;
      touch-action: none;
    }

    .scratch-canvas.revealed {
      opacity: 0;
      pointer-events: none;
    }

    /* ==========================================================================
       5. ELEMENTOS INTERATIVOS (GATO ARTICULADO E FOCA)
       ========================================================================== */
    .marionette-cat {
      position: absolute;
      top: 5px;
      left: 40px;
      width: 250px;
      height: 444px;
      cursor: pointer;
      z-index: 20;
      transform: scale(0.7);
      filter: drop-shadow(0 6px 12px rgba(0, 77, 64, 0.2));
      transition: filter 0.3s ease;
    }

    .marionette-cat:hover {
      filter: drop-shadow(0 8px 16px rgba(156, 128, 255, 0.55));
    }

    .cat-part {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease-out;
      pointer-events: none;
    }

    .part-head { z-index: 90; transform: translate(30px, 70px); }
    .part-body { z-index: 10; transform-origin: 74px 43.5px; transform: translate(-100px, -50px); }
    .part-tail { z-index: 1; transform-origin: 38% 62%; transform: translate(15px, -90px); }

    .is-animating .part-body { animation: swing-body 1.5s cubic-bezier(0, 0, 0.1, 1); }
    .is-animating .part-tail { animation: wag-tail 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

    @keyframes swing-body {
      0%, 100% { transform: translate(-100px, -50px) rotate(0deg); }
      20%      { transform: translate(-100px, -50px) rotate(3.5deg); }
      50%      { transform: translate(-100px, -50px) rotate(-2.5deg); }
      80%      { transform: translate(-100px, -50px) rotate(1.5deg); }
    }

    @keyframes wag-tail {
      0%, 100% { transform: translate(15px, -90px) rotate(0deg); }
      15%      { transform: translate(15px, -90px) rotate(-25deg); }
      40%      { transform: translate(15px, -90px) rotate(15deg); }
      65%      { transform: translate(15px, -90px) rotate(-10deg); }
      85%      { transform: translate(15px, -90px) rotate(5deg); }
    }

    .seal {
      position: absolute;
      bottom: -1px;
      left: 147px;
      width: 170px;
      cursor: pointer;
      z-index: 16;
      transition: transform 0.2s ease, filter 0.2s ease;
      filter: drop-shadow(0 4px 10px rgba(0, 96, 100, 0.25));
    }

    .seal:hover {
      filter: drop-shadow(0 6px 14px rgba(38, 198, 218, 0.6));
    }

    .shake-active {
      animation: shake-anim 0.65s ease-in-out;
    }

    @keyframes shake-anim {
      0%, 100% { transform: rotate(0deg) translateX(0) scale(1); }
      15%      { transform: rotate(-12deg) translateX(-4px) scale(1.05); }
      30%      { transform: rotate(12deg) translateX(4px) scale(1.05); }
      45%      { transform: rotate(-10deg) translateX(-4px) scale(1.05); }
      60%      { transform: rotate(10deg) translateX(4px) scale(1.03); }
      75%      { transform: rotate(-5deg) translateX(-2px) scale(1.01); }
      90%      { transform: rotate(5deg) translateX(2px) scale(1.01); }
    }

    /* ==========================================================================
       6. PARTÍCULAS E EFEITOS DE ANIMAÇÃO
       ========================================================================== */
    .floating-particle {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp ease-out forwards;
      z-index: 35;
      opacity: 0;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.4) rotate(-10deg); opacity: 1; }
      65%  { opacity: 1; }
      100% { transform: translateY(-95px) scale(1.35) rotate(12deg); opacity: 0; }
    }

    .happy-wiggle {
      animation: wiggle 0.45s ease-in-out;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-1.8deg) scale(1.01); }
      50%      { transform: rotate(1.8deg) scale(1.01); }
      75%      { transform: rotate(-1deg) scale(1.01); }
    }

    @media (max-width: 700px) {
      .card.open {
        transform: translateX(80px) scale(0.85);
      }
    }
  </style>
</head>
<body>

  <!-- Luzes submarinas decorativas -->
  <div class="sunbeams"></div>

  <!-- Cena 3D Interativa -->
  <div class="scene-container" id="sceneContainer">
    <div class="scene" id="scene">
      
      <div class="card" id="birthdayCard">
        
        <!-- PÁGINA BASE (DIREITA INTERNA - 2.png Direita) -->
        <div class="inside-right" id="rightPage">
          <div class="marionette-cat" id="jointedCat" title="Faça carinho no gatinho!">
            <img src="rabo.png" class="cat-part part-tail" alt="Rabo do gato">
            <img src="Corpo.png" class="cat-part part-body" alt="Corpo do gato">
            <img src="cabeca.png" class="cat-part part-head" alt="Cabeça do gato">
          </div>
        </div>
        
        <!-- COSTAS DO CARTÃO (1.png Esquerda) -->
        <div class="back"></div>

        <!-- ABA MÓVEL (CAPA + ESQUERDA INTERNA) -->
        <div class="flap">
          <!-- Capa Frontal (1.png Direita) -->
          <div class="face front"></div>
          
          <!-- Lado Esquerdo Interno (2.png Esquerda + Raspadinha + Foca) -->
          <div class="face inside-left" id="leftPage">
            
            <!-- Raspadinha estilo "Recompensa de Missão" -->
            <div class="scratch-container">
              <span class="quest-tag">✨ SECRET LOOT UNLOCKED ✨</span>
              <div class="scratch-secret">
                <span class="coupon-highlight">One Free Tight Hug!</span>
                <span class="coupon-sub"> 🎟️Redeemable in person • Infinite validity 💙</span>
              </div>
              <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
            </div>

            <!-- Foca Interativa -->
            <img src="foca.png" class="seal" id="sealImg" title="Clique na foquinha!" alt="Foquinha">
          </div>
        </div>
        
      </div>

    </div>
  </div>

  <!-- Biblioteca de Confetes -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    /* ==========================================================================
       1. ELEMENTOS E ESTADO GLOBAL
       ========================================================================== */
    const sceneContainer = document.getElementById('sceneContainer');
    const scene = document.getElementById('scene');
    const card = document.getElementById('birthdayCard');
    const rightPage = document.getElementById('rightPage');
    const leftPage = document.getElementById('leftPage');
    const cat = document.getElementById('jointedCat');
    const seal = document.getElementById('sealImg');
    const scratchCanvas = document.getElementById('scratchCanvas');

    let dragThresholdPassed = false;

    /* ==========================================================================
       2. ABERTURA DO CARTÃO E SISTEMA DE PARTÍCULAS
       ========================================================================== */
    card.addEventListener('click', () => {
      if (dragThresholdPassed) return;

      card.classList.toggle('open');

      if (card.classList.contains('open') && typeof confetti === 'function') {
        confetti({
          particleCount: 140,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#26c6da', '#80deea', '#ff8a80', '#ffd54f', '#ffffff']
        });
      }
    });

    function triggerRestartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth; // Força reflow para reiniciar animação CSS
      element.classList.add(className);
    }

    function spawnFloatingParticles(container, emojis, count, leftRange, topRange, maxDuration) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.className = 'floating-particle';
        p.style.left = (leftRange[0] + Math.random() * leftRange[1]) + '%';
        p.style.top = (topRange[0] + Math.random() * topRange[1]) + '%';
        p.style.animationDuration = (0.8 + Math.random() * maxDuration) + 's';
        container.appendChild(p);
        setTimeout(() => p.remove(), 2000);
      }
    }

    cat.addEventListener('click', (e) => {
      e.stopPropagation();
      if (dragThresholdPassed) return;

      triggerRestartAnimation(cat, 'is-animating');
      triggerRestartAnimation(rightPage, 'happy-wiggle');
      spawnFloatingParticles(rightPage, ['💙', '✨', '🐾', '💖'], 9, [35, 30], [40, 20], 0.9);
    });

    seal.addEventListener('click', (e) => {
      e.stopPropagation();
      if (dragThresholdPassed) return;

      triggerRestartAnimation(seal, 'shake-active');
      spawnFloatingParticles(leftPage, ['🫧', '🐟', '💙', '✨'], 5, [55, 25], [70, 15], 0.7);
    });

    /* ==========================================================================
       3. GERADOR DE BOLHAS DO OCEANO (OTIMIZADO COM DOCUMENT FRAGMENT)
       ========================================================================== */
    function createBubbles() {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < 22; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = (Math.random() * 24 + 8).toFixed(1) + 'px';
        bubble.style.left = (Math.random() * 100).toFixed(1) + 'vw';
        bubble.style.width = size;
        bubble.style.height = size;
        bubble.style.animationDuration = (Math.random() * 6 + 5).toFixed(2) + 's';
        bubble.style.animationDelay = (Math.random() * 6).toFixed(2) + 's';
        fragment.appendChild(bubble);
      }
      document.body.appendChild(fragment);
    }
    createBubbles();

    /* ==========================================================================
       4. SISTEMA DA RASPADINHA (TRAÇO CONTÍNUO & SUPORTE HIGH-DPI)
       ========================================================================== */
    function initScratchCard() {
      const ctx = scratchCanvas.getContext('2d', { willReadFrequently: true });
      const dpr = window.devicePixelRatio || 1;
      const width = scratchCanvas.offsetWidth;
      const height = scratchCanvas.offsetHeight;

      scratchCanvas.width = width * dpr;
      scratchCanvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      // Gradiente Perolado
      const grad = ctx.createLinearGradient(0, 0, width, height);
      grad.addColorStop(0, 'rgba(235, 252, 255, 0.97)');
      grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.99)');
      grad.addColorStop(1, 'rgba(224, 247, 250, 0.97)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Brilho perolado decorativo
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      for (let i = 0; i < 40; i++) {
        ctx.beginPath();
        ctx.arc(Math.random() * width, Math.random() * height, Math.random() * 1.5 + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Texto principal
      ctx.font = 'bold 15px "Quicksand", sans-serif';
      ctx.fillStyle = '#005f73';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 6;
      ctx.fillText('Secret Surrender', width / 2, height / 2 - 8);

      // Subtítulo
      ctx.shadowBlur = 0;
      ctx.font = '500 12px "Quicksand", sans-serif';
      ctx.fillStyle = '#0a9396';
      ctx.fillText('scratch gently to unlock...', width / 2, height / 2 + 14);

      let isDrawing = false;
      let isRevealed = false;
      let lastX = 0;
      let lastY = 0;

      function getPointerPos(e) {
        const rect = scratchCanvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (width / rect.width),
          y: (e.clientY - rect.top) * (height / rect.height)
        };
      }

      function scratchLine(x, y) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 38;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
      }

      function checkRevealProgress() {
        if (isRevealed) return;
        const pixels = ctx.getImageData(0, 0, scratchCanvas.width, scratchCanvas.height).data;
        let transparentPixels = 0;
        const step = 16;

        for (let i = 3; i < pixels.length; i += step) {
          if (pixels[i] < 128) transparentPixels++;
        }

        if (transparentPixels / (pixels.length / step) > 0.52) {
          isRevealed = true;
          scratchCanvas.classList.add('revealed');

          if (typeof confetti === 'function') {
            confetti({
              particleCount: 55,
              spread: 70,
              origin: { y: 0.55 },
              colors: ['#ffffff', '#a8dadc', '#457b9d', '#e0fbfc']
            });
          }
        }
      }

      scratchCanvas.addEventListener('pointerdown', (e) => {
        if (isRevealed) return;
        isDrawing = true;
        dragThresholdPassed = true;
        e.stopPropagation();
        scratchCanvas.setPointerCapture(e.pointerId);

        const pos = getPointerPos(e);
        lastX = pos.x;
        lastY = pos.y;
        scratchLine(pos.x, pos.y);
      });

      scratchCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || isRevealed) return;
        e.stopPropagation();
        const pos = getPointerPos(e);
        scratchLine(pos.x, pos.y);
      });

      const endScratch = (e) => {
        if (!isDrawing) return;
        isDrawing = false;
        if (e && e.pointerId && scratchCanvas.hasPointerCapture(e.pointerId)) {
          scratchCanvas.releasePointerCapture(e.pointerId);
        }
        checkRevealProgress();
        setTimeout(() => { dragThresholdPassed = false; }, 80);
      };

      scratchCanvas.addEventListener('pointerup', endScratch);
      scratchCanvas.addEventListener('pointercancel', endScratch);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(initScratchCard);
    } else {
      window.addEventListener('load', initScratchCard);
    }

    /* ==========================================================================
       5. SISTEMA DE GIRO 360° E PARALLAX (UNIFICADO COM POINTER EVENTS)
       ========================================================================== */
    let isDragging = false;
    let startX = 0, startY = 0;
    let currentRotX = 0, currentRotY = 0;
    let lastRotX = 0, lastRotY = 0;

    sceneContainer.addEventListener('pointerdown', (e) => {
      if (e.target === scratchCanvas) return;
      isDragging = true;
      dragThresholdPassed = false;
      startX = e.clientX;
      startY = e.clientY;
    });

    sceneContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) {
        if (e.pointerType === 'mouse') {
          const xAxis = (window.innerWidth / 2 - e.clientX) / 45;
          const yAxis = (window.innerHeight / 2 - e.clientY) / 45;
          scene.style.transform = `rotateX(${currentRotX + yAxis}deg) rotateY(${currentRotY - xAxis}deg)`;
        }
        return;
      }

      const deltaX = e.clientX - startX;
      const deltaY = e.clientY - startY;

      if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
        dragThresholdPassed = true;
      }

      lastRotY = currentRotY + (deltaX / 2.8);
      lastRotX = Math.max(-45, Math.min(45, currentRotX - (deltaY / 2.8)));

      scene.style.transform = `rotateX(${lastRotX}deg) rotateY(${lastRotY}deg)`;
    });

    function endDrag() {
      if (!isDragging) return;
      isDragging = false;
      currentRotX = lastRotX;
      currentRotY = lastRotY;
      setTimeout(() => { dragThresholdPassed = false; }, 60);
    }

    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
  </script>
</body>
</html>
